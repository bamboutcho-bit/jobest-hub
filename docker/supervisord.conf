[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
loglevel=info

; ----------------------------------------------------------------------------
; Infrastructure
; ----------------------------------------------------------------------------

[program:postgres]
command=/usr/lib/postgresql/16/bin/postgres -D /var/lib/postgresql/data
user=postgres
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/postgres.log
stderr_logfile=/var/log/supervisor/postgres.err.log

[program:ollama]
command=/usr/local/bin/ollama serve
environment=OLLAMA_HOST="0.0.0.0:11434"
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/ollama.log
stderr_logfile=/var/log/supervisor/ollama.err.log

; One-shot: waits for the Ollama server, pulls the configured model, exits.
; (autorestart=false so it doesn't loop forever once it succeeds.)
[program:ollama-pull]
command=/bin/sh -c "until curl -fsS http://localhost:11434/api/tags >/dev/null 2>&1; do sleep 1; done; ollama pull \"${OLLAMA_MODEL:-llama3.2:3b}\""
autostart=true
autorestart=false
startretries=1
priority=20
stdout_logfile=/var/log/supervisor/ollama-pull.log
stderr_logfile=/var/log/supervisor/ollama-pull.err.log

[program:browser]
command=npx --yes playwright@1.62.0 run-server --port 3000 --host 0.0.0.0
directory=/app
autostart=true
autorestart=true
priority=10
stdout_logfile=/var/log/supervisor/browser.log
stderr_logfile=/var/log/supervisor/browser.err.log

; ----------------------------------------------------------------------------
; Application processes
; each waits for postgres+ollama via wait-for-deps.sh before starting
; ----------------------------------------------------------------------------

[program:app-pipeline]
command=/usr/local/bin/wait-for-deps.sh python3 scripts/run_pipeline.py --loop
directory=/app
environment=WAIT_FOR_BROWSER="true"
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/supervisor/app-pipeline.log
stderr_logfile=/var/log/supervisor/app-pipeline.err.log

[program:app-inbox]
command=/usr/local/bin/wait-for-deps.sh python3 scripts/check_inbox.py --loop
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/supervisor/app-inbox.log
stderr_logfile=/var/log/supervisor/app-inbox.err.log

[program:app-dashboard]
command=/usr/local/bin/wait-for-deps.sh python3 scripts/dashboard.py
directory=/app
autostart=true
autorestart=true
priority=30
startsecs=5
stdout_logfile=/var/log/supervisor/app-dashboard.log
stderr_logfile=/var/log/supervisor/app-dashboard.err.log
